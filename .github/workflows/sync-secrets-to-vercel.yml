name: Sync secrets to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert ANTHROPIC_API_KEY in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROJECT_ID: prj_wHhHdUBFiUgFe5kJG5ZKUtHYyDrf
          TEAM_ID: team_sU6nk8QU4gFhNTZ7qLq3zxmD
        run: |
          # Delete existing env var if present (ignore 404)
          EXISTING=$(curl -s "https://api.vercel.com/v9/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" | \
            jq -r '.envs[] | select(.key == "ANTHROPIC_API_KEY") | .id' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            curl -s -X DELETE "https://api.vercel.com/v9/projects/$PROJECT_ID/env/$EXISTING?teamId=$TEAM_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN"
            echo "Deleted existing ANTHROPIC_API_KEY (id: $EXISTING)"
          fi

          # Create fresh with value from GitHub Secret
          RESULT=$(curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env?teamId=$TEAM_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"key\": \"ANTHROPIC_API_KEY\",
              \"value\": \"$ANTHROPIC_API_KEY\",
              \"type\": \"encrypted\",
              \"target\": [\"production\", \"preview\"]
            }")

          echo "Result: $(echo $RESULT | jq -r '.key // .error.message // .')"
